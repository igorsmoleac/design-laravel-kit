name: Deploy demo to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify docs
        run: test -f docs/index.html

      - name: Add release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          page = Path("docs/index.html")
          content = page.read_text(encoding="utf-8")
          marker = "<!-- RELEASE_VERSION -->"
          if marker not in content:
              raise SystemExit("RELEASE_VERSION marker not found in docs/index.html")
          page.write_text(content.replace(marker, html.escape(os.environ["RELEASE_TAG"])), encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
