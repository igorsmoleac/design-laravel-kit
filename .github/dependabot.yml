version: 2

updates:
  # Composer (PHP dependencies)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "php"
    commit-message:
      prefix: "[Deps]"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "phpunit/*"
          - "orchestra/*"
          - "laravel/pint"
      laravel:
        patterns:
          - "laravel/*"
          - "illuminate/*"

  # npm (frontend build dependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "[Deps]"
      include: "scope"
    ignore:
      # Bootstrap Italia is pinned on purpose (see README)
      - dependency-name: "bootstrap-italia"
